<div class="modal-header">
  <h5 class="modal-title" id="modal-basic-title">{{formTitle}} Vehiculo </h5>
  <button type="button"
          class="btn btn-primary"
          aria-label="Cerrar"
          title="Cerrar"
          (click)="activeModal.dismiss('Cross click')">
      <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="container">
              <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="patenteInput">Patente</label>
            <div class="input-group">
              <input id="patenteInput"
                       formControlName="patente"
                       class="form-control"
                       required
                       type="text" 
                       placeholder="ingrese pantente"
                       (input)="toUpperCase($event)"
                       [ngClass]="{'is-invalid':Patente?.errors && Patente?.touched, 'is-valid': !Patente?.errors && Patente?.touched }"
              [readonly]="sinEdicion">    
              <div *ngIf="Patente?.errors?.required && Patente?.touched" class="text-danger fs-6">
                  Ingrese la patente por favor
              </div>
              <div *ngIf="Patente?.errors && Patente?.touched" class="text-danger fs-6">
                  Patente no valida
              </div>  
            </div>
          </div>
          <div class="form-group">
            <label for="tarifaSelect">Tarifa</label>        
            <select id="tarifaSelect" class="form-select form-select-md mb-3" (change)="changeTarifa($event)" aria-label="Tarifa" title="tarifa">
              <option value={{tarifaSeleccionada}}>Elegir Tarifa</option>
              <option *ngFor="let tarifa of tarifas">
                {{tarifa.nombre}}
              </option>
            </select>
          </div>
          <div class="form-group">
            <label for="descripcionInput">Descripcion</label>
            <div class="input-group">
              <input id="descripcionInput" formControlName="descripcion" class="form-control" required type="text" placeholder="descripcion">
            </div>
          </div>
          <table class="table" *ngIf='titulo==="Agregar"'>
            <tr>
              <td>
                <div class="form-group p-0">
                  <label for="fechaIngresoInput">Ingreso</label>
                  <div class="input-group mb-3">
                    <span class="input-group-text ">Fecha</span>
                    <input id="fechaIngresoInput" class="fw-bold" type="text" placeholder="ingreso" value="{{fechas.fechaIngreso}}" disabled>
                  </div>
                  <div class="input-group mb-3">
                    <span class="input-group-text">Hora</span>
                    <input id="horaIngresoInput" class="fw-bold" type="text" placeholder="hora" value="{{fechas.horaIngreso}} " disabled>
                  </div>
                </div>
              </td>
            </tr>
          </table>
          <div class="modal-footer">
            <button type="submit"class="btn btn-success">
              {{formTitle}}
            </button>
          </div>
        </form>
      
      
    </div> 
</div>
